<script>
const K=(t,c='')=>`<span class="k ${c}">${t}</span>`,C=(h,p,l,x='')=>`<div class="a c ${x}">${l?K(l)+'<br>':''}<h3>${h}</h3><p>${p||''}</p></div>`,G=x=>`<div class="gr">${x}</div>`,H=(k,t,x='')=>`<p class="a kk ${x}">${K(k,'w2')}</p><h2 class="a ${x}">${t}</h2>`;
const W=a=>a.map(([t,k])=>`<span class="wd" data-k="${k}">${t}</span>`).join(' ');
const LP=`<div class="a lp ni"><p class="m">Ketuk frasa Arab yang bergaris putus untuk melihat kaidah linguistik dan pendapat mufasir.</p></div>`;
const AY=(k,t,ar,tr,x)=>H(k,t)+`<div class="a ar ni">${W(ar)}</div><p class="a tr">${tr}</p>${LP}`+G(x);
const TF=(k,t,L,n)=>H(k,t)+G(L.map(x=>C(x[1],x[2],x[0])).join(''))+(n?`<p class="a m ft" style="margin-top:14px">${n}</p>`:'');
const CH=a=>`<div class="a ch" style="margin-top:12px">${a.map(x=>K(x)).join('')}</div>`;
const SL=[
`<p class="a kk">${K('Sebelum kita mulai')}</p><div id="gl" class="a ni"></div><h2 class="a" style="margin-bottom:6px">Ilmu itu <span class="g">diantarkan</span>.</h2><p class="a m">Geser bola dunia, kurir akan berlari mengikuti putarannya.</p><button class="a btn" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();go(1)">Mulai Presentasi</button>`,
`<img class="a lg" src="logo_uin.png" alt="Logo UIN SGD Bandung"><p class="a kk" style="margin-top:14px">${K('Tugas Mata Kuliah, Pascasarjana')}</p><h1 class="a" style="margin:8px 0">Guru dalam <span class="g">Proses Pendidikan</span></h1><h2 class="a m" style="font-size:clamp(18px,3vw,32px)">Kajian Ayat dan Manajemen Pengelolaannya</h2>`+G(C(`Akbar Tausiur Rido`,'','Penyaji')+C(`Tafsir Manajemen Pendidikan Islam`,'','Mata Kuliah')+C(`Dr. Cecep Anwar, M.Ag.`,'','Dosen Pengampu'))+`<p class="a m ft" style="margin-top:14px">Universitas Islam Negeri Sunan Gunung Djati Bandung, 2026</p>`,
H('Latar Belakang','Guru: pewaris misi para nabi')+G(C('Idealnya',`Guru adalah waratsat al-anbiya, pewaris misi para nabi. Pendidikan membentuk karakter, menyucikan jiwa, dan mendewasakan moral, bukan sekadar memindahkan ilmu.`,'01')+C('Realitasnya',`Kualifikasi sering berhenti pada aspek administratif dan pengembangan bersifat parsial. Contoh lokal: sekitar <b>40 persen</b> pendidik rutin mengikuti pelatihan.`,'02')+C('Diagnosisnya',`Masalah tidak hanya pada guru, tetapi pada <b>cara lembaga mengelola guru</b>.`,'03'))+`<p class="a ft" style="margin-top:14px">${K('Celah kajian: pemetaan fungsi kenabian ke kompetensi guru hingga siklus MSDM belum ada','w2')}</p>`,
H('Rumusan dan Metode','Tiga pertanyaan, satu kerangka')+G(C('Makna menurut mufasir',`Bagaimana mufasir memaknai <b>tilawah, tazkiyah, dan ta'lim al-kitab wa al-hikmah</b>?`,'1')+C('Pemetaan',`Bagaimana ketiganya terpetakan pada <b>empat kompetensi guru</b>?`,'2')+C('Operasionalisasi',`Bagaimana diturunkan ke <b>manajemen SDM</b> pendidik?`,'3')+C('Tafsir klasik',`Ath-Thabari dan Ibnu Katsir (kuat pada riwayat), Al-Qurthubi (perhatian pada hukum).`,'Enam kitab tafsir')+C('Tafsir modern dan kontemporer',`Al-Mishbah (Quraish Shihab), Al-Munir (Az-Zuhaili), Fi Zhilalil Quran (Sayyid Quthb).`,'Enam kitab tafsir'))+CH([`Kualitatif, kajian kepustakaan`,`Tafsir maudhu'i dan muqaran`,`Empat ayat`]),
AY('Ayat 1, ayat utama','QS Al-Jumu\'ah [62]: 2',[[`هُوَ ٱلَّذِى بَعَثَ`,'bats'],[`فِى ٱلْأُمِّيِّۦنَ`,'umm'],[`رَسُولًا مِّنْهُمْ`,'minhum'],[`يَتْلُوا عَلَيْهِمْ ءَايَٰتِهِۦ`,'yatlu'],[`وَيُزَكِّيهِمْ`,'yuzakki'],[`وَيُعَلِّمُهُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ`,'talim'],[`وَإِن كَانُوا مِن قَبْلُ لَفِى ضَلَٰلٍ مُّبِينٍ`,'dhalal']],`“Dialah yang mengutus kepada kaum yang ummi seorang Rasul di antara mereka, yang membacakan ayat-ayat-Nya kepada mereka, menyucikan mereka, dan mengajarkan kepada mereka Kitab dan Hikmah, dan sesungguhnya mereka sebelumnya benar-benar dalam kesesatan yang nyata.”`,C('Konteks',`Surah Madaniyyah tanpa sabab nuzul khusus pada ayat ini (yang masyhur ada pada ayat 11). Dibaca lewat <i>siyaq</i> dan <i>munasabah</i> dengan doa Ibrahim.`)+C('Struktur',`<b>Tilawah</b>, lalu <b>tazkiyah</b>, lalu <b>ta'lim</b> Kitab dan Hikmah. Tujuannya keluar dari <i>dhalalin mubin</i>.`)),
AY('Ayat 2, pembanding','QS Al-Baqarah [2]: 151',[[`كَمَآ أَرْسَلْنَا فِيكُمْ رَسُولًا مِّنكُمْ`,'kama'],[`يَتْلُوا عَلَيْكُمْ ءَايَٰتِنَا`,'yatlu'],[`وَيُزَكِّيكُمْ`,'yuzakki'],[`وَيُعَلِّمُكُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ`,'talim'],[`وَيُعَلِّمُكُم مَّا لَمْ تَكُونُوا تَعْلَمُونَ`,'malam']],`“Sebagaimana (Kami telah menyempurnakan nikmat Kami kepadamu) Kami telah mengutus kepadamu Rasul di antara kamu yang membacakan ayat-ayat Kami kepada kamu dan menyucikan kamu dan mengajarkan kepadamu Al-Kitab dan Al-Hikmah, serta mengajarkan kepada kamu apa yang belum kamu ketahui.”`,C('Fungsi keempat',`<i>Ma lam takunu ta'lamun</i>: pendidikan membuka pengetahuan baru (Sumbulah dan Rafiq, 2026).`)+C('Bagi guru',`Tugas mengajar mencakup kesediaan <b>terus belajar</b>. Redaksi <i>minkum</i> berbicara langsung kepada pendengar.`)),
AY('Ayat 3, pembanding','QS Ali \'Imran [3]: 164',[[`لَقَدْ مَنَّ ٱللَّهُ عَلَى ٱلْمُؤْمِنِينَ`,'manna'],[`إِذْ بَعَثَ فِيهِمْ رَسُولًا مِّنْ أَنفُسِهِمْ`,'anfus'],[`يَتْلُوا عَلَيْهِمْ ءَايَٰتِهِۦ`,'yatlu'],[`وَيُزَكِّيهِمْ`,'yuzakki'],[`وَيُعَلِّمُهُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ`,'talim'],[`وَإِن كَانُوا مِن قَبْلُ لَفِى ضَلَٰلٍ مُّبِينٍ`,'dhalal']],`“Sungguh Allah telah memberi karunia kepada orang-orang yang beriman ketika Allah mengutus di antara mereka seorang rasul dari golongan mereka sendiri, yang membacakan kepada mereka ayat-ayat Allah, membersihkan (jiwa) mereka, dan mengajarkan kepada mereka Al-Kitab dan Al-Hikmah. Dan sesungguhnya sebelum (kedatangan Nabi) itu, mereka adalah benar-benar dalam kesesatan yang nyata.”`,C('Sayyid Quthb',`Kehadiran Rasul sebagai pendidik adalah <b>karunia terbesar</b> bagi kaum beriman karena membebaskan mereka dari kesesatan nyata.`,'Mufasir')+C(`Bingkai <i>manna</i>`,`Profesi pendidik dipandang sebagai amanah bernilai ibadah (Basith dan Mubin, 2025).`)),
AY('Ayat 4, pembanding','QS Al-Baqarah [2]: 129',[[`رَبَّنَا وَٱبْعَثْ فِيهِمْ رَسُولًا مِّنْهُمْ`,'doa'],[`يَتْلُوا عَلَيْهِمْ ءَايَٰتِكَ`,'yatlu'],[`وَيُعَلِّمُهُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ`,'talim'],[`وَيُزَكِّيهِمْ ۚ`,'yuzakki'],[`إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ`,'aziz']],`“Ya Tuhan kami, utuslah di tengah mereka seorang rasul dari kalangan mereka, yang akan membacakan ayat-ayat-Mu kepada mereka, mengajarkan Kitab dan Hikmah kepada mereka, dan menyucikan mereka. Sungguh, Engkaulah Yang Maha Perkasa, Maha Bijaksana.”`,C('Al-Qurthubi, Ath-Thabari, Ibnu Katsir',`Doa Nabi Ibrahim <b>terkabul</b> melalui pengutusan Nabi Muhammad saw.`,'Mufasir')+C('Urutan berbeda',`<b>Ta'lim</b> disebut sebelum <b>tazkiyah</b> karena isi permohonan sebagai kebutuhan dasar umat. Ditutup dengan <i>Al-'Aziz Al-Hakim</i>.`)),

const NT=[
[['S',`Coba bayangkan seorang kurir berlari di atas bola dunia sambil membawa sebuah buku. Ia tidak menulis bukunya, tugasnya memastikan ilmu itu sampai ke tangan yang membutuhkan. Itulah gambaran paling dekat tentang seorang guru. Silakan saya putar bolanya, lihat kurirnya ikut berlari makin kencang.`]],
[['O',`Di sekolah mana pun, kita pasti punya satu guru yang masih diingat sampai hari ini. Anehnya, yang kita ingat sering bukan rumus atau hafalannya, tetapi cara beliau memperlakukan kita. Judul kita hari ini: Guru dalam Proses Pendidikan, kajian ayat dan manajemen pengelolaannya. Terima kasih kepada Bapak Dr. Cecep Anwar dan teman-teman.`]],
[['C',`Kalau guru sepenting itu, mengapa mutu guru masih sering dikeluhkan? Apakah semata kesalahan gurunya? Mari kita pikirkan bersama.`],['I',`Ada contoh lokal, hanya sekitar 40 persen pendidik yang rutin ikut pelatihan. Ini ilustrasi lokal, bukan potret nasional. Diagnosis artikel ini: masalahnya ada pada cara lembaga mengelola guru, dan celah kajiannya belum ada pemetaan dari fungsi kenabian sampai siklus manajemen SDM.`]],
[['A',`Alur kita hari ini. Pertama, apa kata mufasir tentang tugas kenabian sebagai pendidik. Kedua, kita petakan pada empat kompetensi guru. Ketiga, kita turunkan ke lima fungsi manajemen SDM. Terakhir simpulan dan satu permainan kecil.`],['I',`Metodenya kepustakaan dengan tafsir tematik dan perbandingan antarmufasir, memakai enam kitab tafsir klasik dan modern.`]],
[['I',`Ini ayat utama kita. Ada tiga kerja kenabian: membacakan, menyucikan, mengajarkan. Surah ini Madaniyyah dan ayat kedua tidak punya sabab nuzul khusus, jadi dibaca lewat konteks dan hubungan antarayat. Silakan ketuk frasa Arab untuk melihat kaidah bahasanya.`],['C',`Menurut teman-teman, mana yang lebih dulu dibutuhkan murid, ilmunya atau jiwanya?`]],
[['I',`Al-Baqarah 151 memuat tiga fungsi yang sama dan menambah satu, mengajarkan apa yang belum kamu ketahui. Artinya guru pun harus terus belajar.`],['O',`Persis pengalaman kita, makin lama mengajar, makin terasa banyak yang belum kita tahu.`]],
[['I',`Ali Imran 164 membingkai pengutusan Rasul sebagai karunia. Sayyid Quthb menyebutnya karunia terbesar bagi kaum beriman. Dari sini profesi guru dipandang sebagai amanah bernilai ibadah.`]],
[['I',`Ini doa Nabi Ibrahim. Al-Qurthubi, Ath-Thabari, dan Ibnu Katsir membacanya sebagai doa yang terkabul lewat Nabi Muhammad. Perhatikan urutannya berbeda, pengajaran disebut sebelum penyucian.`],['C',`Mengapa urutannya berubah? Jawabannya kita bahas di slide temuan redaksional.`]],
[['I',`Dua istilah kunci. Al-ummiyyin, masyarakat Arab yang mayoritas tidak punya tradisi baca-tulis kitab suci. Dhalalin mubin, kesesatan nyata akibat krisis akidah dan kebodohan moral. Jadi pendidikan kenabian berangkat dari krisis keyakinan dan pengetahuan, bukan sekadar menambah wawasan.`]],
[['I',`Lima mufasir, lima warna. Ibnu Katsir menekankan membacakan wahyu, Ath-Thabari penyampaian, Quraish Shihab bahkan membaca ayat alam, Sayyid Quthb pintu kesadaran akidah, dan Az-Zuhaili membangun nalar.`],['O',`Artinya guru Biologi atau Fisika pun sedang bertilawah, karena ia membaca ayat kauniyah.`]],
[['I',`Al-Qurthubi, Az-Zuhaili, Sayyid Quthb, dan Ibnu Katsir sepakat tazkiyah adalah pembersihan jiwa dan penumbuhan akhlak.`],['C',`Bisakah lembaga menilai kesucian hati seseorang? Tidak. Yang bisa dilakukan adalah menciptakan kondisi dan mengamati perilakunya, seperti jujur, disiplin, sabar, dan santun.`]],
[['I',`Menurut para mufasir, al-Kitab berkaitan dengan apa yang diketahui, sedangkan hikmah berkaitan dengan kapan, kepada siapa, dan bagaimana ilmu itu diterapkan. Rumusan pembedaan ini adalah pembacaan penulis.`]],
[['I',`Tiga isyarat dari teks: urutan fungsi, bentuk mudhari yang berulang, dan kata minhum yang menandakan pendidik dari tengah kaumnya.`],['C',`Kalau guru itu dari tengah kaumnya, apakah cukup hanya dilihat dari ijazahnya?`]],
[['I',`Tilawah untuk pedagogik, tazkiyah untuk kepribadian, ta'lim al-kitab untuk profesional, ta'lim al-hikmah untuk sosial. Tazkiyah menjadi poros, sebab keterampilan dan ilmu tanpa keteladanan kehilangan daya didik.`]],
[['I',`Lima fungsi manajemen: perencanaan, rekrutmen, pembinaan, penilaian, dan kompensasi. Setiap nilai punya praktik dan indikator yang teramati.`],['O',`Contohnya rekrutmen. Bukan hanya tes, tetapi juga rekam jejak akhlak dengan rubrik dan bobot yang diumumkan sejak awal.`]],
[['A',`Kerangka ini tidak diterapkan sekaligus. Ada empat tahap: diagnosis, perumusan standar, uji terbatas, lalu pelembagaan.`],['L',`Lembaga kecil pun bisa mulai dari tahap diagnosis pekan ini, cukup dengan mengaudit praktik SDM yang berjalan.`]],
[['C',`Apa risiko terbesarnya? Formalisme, tazkiyah berubah menjadi daftar centang ibadah.`],['I',`Risiko lain adalah subjektivitas dan kesenjangan kapasitas. Kajian ini juga masih konseptual, belum diuji empiris.`]],
[['I',`Ringkasnya tiga, empat, lima. Tiga fungsi kenabian, empat kompetensi guru, lima fungsi manajemen SDM.`],['L',`Manfaat nyata: pengelola mendapat profil, instrumen, dan pembinaan berkelanjutan. Guru mendapat martabat dan kesejahteraan yang adil. Pembuat kebijakan mendapat rujukan standardisasi.`]],
[['L',`Silakan ketuk tiga tombol ini dan lihat kompetensi serta praktik yang menyertainya. Ilmu diantarkan oleh orang yang jiwanya terjaga. Terima kasih, mohon arahan dan masukan dari Bapak Dr. Cecep Anwar.`]]];
const LW={
bats:{t:`Ba'atsa, mengutus`,b:`Fi'il madhi yang menegaskan pengutusan telah terjadi. Allah sebagai pelaku (fa'il) dan huwa sebagai pangkal kalimat.`,m:[['Sayyid Quthb dan Kamal dkk.',`Pengutusan Rasul dari kalangan mereka sendiri sejalan dengan doa Nabi Ibrahim.`]]},
umm:{t:`Al-Ummiyyin`,b:`Jamak mudzakkar salim yang majrur oleh huruf jar fi (ditandai ya dan nun). Berasal dari kata ummi.`,m:[['Al-Qurthubi',`Merujuk pada masyarakat Arab yang mayoritas tidak memiliki tradisi baca-tulis kitab suci sebelum Islam.`],['Ath-Thabari',`Sejalan dengan Al-Qurthubi: merujuk pada masyarakat Arab yang mayoritas tidak memiliki tradisi baca-tulis kitab suci.`]]},
minhum:{t:`Minhum, dari kalangan mereka`,b:`Jar majrur yang menerangkan rasulan: Rasul berasal dari kalangan mereka. Redaksinya minhum (62:2 dan 2:129), min anfusihim (3:164), dan minkum (2:151).`,m:[['Sayyid Quthb',`Pengutusan Rasul dari kalangan mereka sendiri sejalan dengan doa Nabi Ibrahim.`],['Pembacaan penulis artikel',`Ketiga redaksi bermakna sama: pendidik hadir dari tengah komunitas yang dididik.`]]},
yatlu:{t:`Yatlu, membacakan`,b:`Fi'il mudhari' dari tala-yatlu. Bentuk mudhari' lazim dipahami menunjuk peristiwa yang sedang berlangsung dan berulang. Secara bahasa berarti membaca, menyampaikan, atau mengikuti sesuatu secara berurutan.`,m:[['Ibnu Katsir',`Membacakan ayat-ayat Al-Quran kepada manusia agar mereka mengenal wahyu Allah.`],['Ath-Thabari',`Tilawah adalah fungsi penyampaian (tabligh), yaitu komunikasi edukatif.`],['M. Quraish Shihab',`Tidak terbatas pada teks tertulis, mencakup pembacaan ayat kauniyah di alam semesta.`],['Sayyid Quthb',`Pintu awal terbukanya kesadaran akidah melalui pemaparan materi yang otentik.`],['Az-Zuhaili',`Membangun kesadaran rasional agar peserta didik memikirkan penciptaan langit dan bumi.`]]},
yuzakki:{t:`Yuzakki, menyucikan`,b:`Fi'il mudhari' dari zakka (bentuk taf'il, mashdar tazkiyah). Bentuk taf'il lazim bermakna menjadikan sesuatu suci. Secara bahasa berarti menyucikan, membersihkan, mengembangkan, dan menumbuhkan kebaikan.`,m:[['Al-Qurthubi',`Membersihkan manusia dari kotoran syirik, maksiat, dan penyakit hati menuju kesucian akhlak.`],['Az-Zuhaili',`Pembebasan jiwa dari kepercayaan paganisme dan tradisi kejahilan.`],['Sayyid Quthb',`Penyucian nurani secara terus-menerus agar manusia memiliki kepekaan spiritual dan keluhuran moral.`],['Ibnu Katsir',`Sarana menumbuhkan ketaatan ibadah dan keluhuran budi pekerti.`]]},
talim:{t:`Yu'allimu, mengajarkan al-Kitab wa al-Hikmah`,b:`Fi'il mudhari' dari 'allama (bentuk taf'il, mashdar ta'lim) yang memiliki dua objek: mereka, dan al-kitab beserta al-hikmah. Menunjuk pada transfer pengetahuan dan pembentukan pemahaman secara sistematis.`,m:[['Mayoritas mufasir',`Al-Kitab dimaknai Al-Quran, al-hikmah dimaknai As-Sunnah, pemahaman agama yang mendalam, atau kebijaksanaan bertindak.`],['Al-Qurthubi',`Pengajaran hikmah mencakup rahasia hukum syariat dan pembentukan kearifan berpikir pada murid.`],['Ath-Thabari',`Hikmah meliputi segala bentuk kebaikan, pemahaman agama, dan ketepatan mengambil keputusan.`],['M. Quraish Shihab',`Melambangkan penguasaan ilmu teoretis sekaligus kemampuan menerapkannya secara bijaksana.`],['Sayyid Quthb',`Pola pendidikan kenabian berhasil mengubah masyarakat jahiliah menjadi peradaban yang berilmu.`]]},
dhalal:{t:`Dhalalin mubin, kesesatan nyata`,b:`Sifat dan yang disifati (na't dan man'ut) yang majrur. Kata in dalam bentuk ringan disertai lam penegas pada lafii dhalal, bermakna sungguh mereka benar-benar dalam kesesatan.`,m:[['Az-Zuhaili',`Kesesatan nyata akibat krisis akidah dan kebodohan moral. Penutup ayat menunjukkan tujuan (ghayah) ketiga fungsi tadi.`],['Sayyid Quthb',`Penutup ini menegaskan tujuan pendidikan kenabian: membebaskan manusia dari kesesatan nyata.`]]},
kama:{t:`Kama arsalna fikum, sebagaimana Kami mengutus`,b:`Kaf penyerupaan, dan arsalna memakai nun al-'azhamah (Kami). Redaksi minkum dan fikum ditujukan langsung kepada pendengar (mukhathab).`,m:[]},
malam:{t:`Ma lam takunu ta'lamun`,b:`Ma maushul: apa yang belum kamu ketahui. Ta'lamun adalah fi'il mudhari' marfu' dengan nun. Inilah fungsi keempat yang hanya ada pada ayat ini.`,m:[['Literatur pendukung (bukan mufasir)',`Sumbulah dan Rafiq (2026) membacanya sebagai pendidikan yang membuka jalan bagi pengetahuan baru.`]]},
